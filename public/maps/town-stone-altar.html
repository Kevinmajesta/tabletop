<!doctype html><meta charset="utf-8"><title>Town square — empty stone altar</title><style>body{margin:0;background:#252c25;display:grid;place-items:center;min-height:100vh}canvas{max-width:100%;max-height:100vh}</style><canvas width="2100" height="1470"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),im=new Image();im.src='town-center-source.jpg';im.onload=()=>{g.drawImage(im,0,0,2100,1470);g.save();g.translate(1050,735);
function polygon(r,n,color,rot=0){g.beginPath();for(let i=0;i<n;i++){let a=i*Math.PI*2/n+rot;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fillStyle=color;g.fill();g.strokeStyle='#453f39';g.lineWidth=3;g.stroke()}
g.fillStyle='#302e2855';g.beginPath();g.ellipse(10,15,65,55,0,0,Math.PI*2);g.fill();polygon(59,8,'#777a70',Math.PI/8);polygon(51,8,'#b8b8a3',Math.PI/8);polygon(41,8,'#636b62',Math.PI/8);g.translate(-3,-6);polygon(40,8,'#c7c6b0',Math.PI/8);
// Radial masonry joints, chips, and inner bevel make the plinth read as carved stone.
for(let i=0;i<8;i++){let a=(i+.5)*Math.PI/4;g.strokeStyle='#777c6c';g.lineWidth=1.5;g.beginPath();g.moveTo(Math.cos(a)*25,Math.sin(a)*25);g.lineTo(Math.cos(a)*38,Math.sin(a)*38);g.stroke()}
polygon(18,6,'#6d7265',.2);polygon(13,6,'#242e29',.2);g.strokeStyle='#dedac0';g.lineWidth=2;g.beginPath();g.moveTo(-10,-8);g.lineTo(3,-13);g.lineTo(12,-5);g.stroke();g.restore();window.ready=true;};
</script>
