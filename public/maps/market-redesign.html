<!doctype html><meta charset="utf-8"><title>Market square redesign — day and night</title><style>body{margin:0;background:#18212b}canvas{width:100%;height:auto}</style><canvas width="4778" height="3584"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),im=new Image();im.src='market-square-new-source.webp';
const lamps=[[.335,.306],[.673,.307],[.211,.498],[.349,.500],[.655,.501],[.788,.494],[.338,.752],[.612,.752]];
window.render=function(night){g.clearRect(0,0,c.width,c.height);g.drawImage(im,0,0);if(!night)return;g.fillStyle='#102440a8';g.fillRect(0,0,c.width,c.height);for(let [u,v] of lamps){let x=u*c.width,y=v*c.height,r=245;g.save();g.globalCompositeOperation='screen';let a=g.createRadialGradient(x,y,4,x,y,r);a.addColorStop(0,'#ffcc8888');a.addColorStop(.25,'#e8a85d55');a.addColorStop(1,'#9f6c3200');g.fillStyle=a;g.fillRect(x-r,y-r,r*2,r*2);g.restore();g.strokeStyle='#3c3426';g.lineWidth=4;g.beginPath();g.moveTo(x,y-12);g.lineTo(x,y-26);g.stroke();g.fillStyle='#4c3d29';g.fillRect(x-7,y-11,14,20);g.fillStyle='#ffe0a5';g.fillRect(x-4,y-8,8,13)} };
im.onload=()=>{console.assert(im.naturalWidth===4778&&im.naturalHeight===3584,'Source dimensions changed');render(false);window.ready=true};</script>
