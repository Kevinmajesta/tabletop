<!doctype html><meta charset="utf-8"><title>Town market — day / night</title><style>body{margin:0;background:#252b2b}canvas{width:100%;height:auto}</style><canvas width="2100" height="1470"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),im=new Image();im.src='town-center-source.jpg';
const stalls=[[350,181,0,'#a95946'],[408,222,Math.PI/2,'#bf9c56'],[349,270,0,'#657e78'],[346,352,Math.PI/2,'#9c675e'],[225,253,0,'#7b8860'],[471,77,0,'#977442'],[115,230,0,'#7b6d88'],[392,413,0,'#a77d4b']];
function stall(x,y,a,col){g.save();g.translate(x,y);g.rotate(a);g.fillStyle='#24291d44';g.fillRect(-19,-11,43,32);g.fillStyle='#59472f';g.fillRect(-17,-10,34,25);g.strokeStyle='#3a3428';g.lineWidth=1.2;g.strokeRect(-17,-10,34,25);g.fillStyle='#b09362';g.fillRect(-17,6,34,10);for(let i=0;i<6;i++){g.fillStyle=['#aa7850','#b4aa66','#697854'][i%3];g.beginPath();g.ellipse(-12+i*5,11,2,2.5,0,0,Math.PI*2);g.fill()}
g.fillStyle=col;g.beginPath();g.moveTo(-20,-15);g.lineTo(20,-15);g.lineTo(23,5);g.lineTo(-23,5);g.closePath();g.fill();g.save();g.clip();g.fillStyle='#ebd6a366';for(let i=-18;i<23;i+=10)g.fillRect(i,-15,4,21);g.restore();g.strokeStyle='#423b30';g.lineWidth=1;g.stroke();g.strokeStyle='#e1c08b88';g.beginPath();g.moveTo(-19,-14);g.lineTo(19,-14);g.stroke();for(let xx of [-20,20]){g.fillStyle='#4f422e';g.fillRect(xx-1,-15,2,24)}g.restore()}
window.render=function(night){g.setTransform(3,0,0,3,0,0);g.clearRect(0,0,700,490);g.drawImage(im,0,0,700,490);for(let s of stalls)stall(...s);
if(night){g.fillStyle='#12213b9c';g.fillRect(0,0,700,490);for(let [x,y] of stalls){g.save();g.globalCompositeOperation='screen';let light=g.createRadialGradient(x,y+18,1,x,y+18,43);light.addColorStop(0,'#ffc66a88');light.addColorStop(.35,'#d28c453d');light.addColorStop(1,'#c0864100');g.fillStyle=light;g.fillRect(x-45,y-30,90,95);g.restore();g.fillStyle='#fbe2a3';g.fillRect(x+19,y+7,2,3)}for(let [x,y] of [[318,149],[430,245],[300,329],[195,362]]){g.fillStyle='#e8bb65';g.fillRect(x,y,5,2)}}};im.onload=()=>{render(false);window.ready=true};
</script>
